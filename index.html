<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Class guestbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">

  <!-- STEP 1: Load the Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

  <style>
    :root {
      --paper: #EEF2F5;
      --sheet: #FFFFFF;
      --ink: #1D2B53;
      --ink-soft: #5A6787;
      --rule: #C9D3E0;
      --highlight: #F5D547;
      --error: #B3261E;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121A2C;
        --sheet: #1B2540;
        --ink: #E6ECF5;
        --ink-soft: #9AA7C2;
        --rule: #2E3B5C;
        --highlight: #E2C23A;
        --error: #FF8A80;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.5;
    }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    h1 { font-size: 2.5rem; line-height: 1.1; margin: 0 0 0.5rem; }
    .intro { color: var(--ink-soft); margin: 0 0 2rem; max-width: 34rem; }

    .card {
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 1.25rem;
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .card p { margin: 0; }
    label { font-weight: 700; font-size: 0.95rem; }
    input, textarea {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 0.6rem 0.7rem;
    }
    textarea { min-height: 5rem; resize: vertical; }
    input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 3px solid var(--highlight);
      outline-offset: 2px;
    }
    .actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    button {
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 4px;
      padding: 0.6rem 1.1rem;
      cursor: pointer;
      background: var(--ink);
      color: var(--paper);
    }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
    button.small { padding: 0.25rem 0.6rem; font-size: 0.85rem; font-weight: 400; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { font-size: 0.95rem; color: var(--ink-soft); }
    .status.error { color: var(--error); }
    .who { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }

    h2 { font-size: 1.25rem; margin: 2.5rem 0 0.75rem; }
    #messages { list-style: none; margin: 0; padding: 0; }
    #messages li { padding: 1rem 0; border-bottom: 1px solid var(--rule); }
    .row-top { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .row-top button { margin-left: auto; }
    .signature {
      font-family: "Caveat", "Segoe Script", cursive;
      font-size: 1.6rem;
      line-height: 1;
      background: linear-gradient(transparent 60%, var(--highlight) 60%);
      color: var(--ink);
      padding: 0 0.15rem;
    }
    .when { font-size: 0.85rem; color: var(--ink-soft); }
    .yours { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
    .text { margin: 0.4rem 0 0; overflow-wrap: anywhere; }
    .empty { color: var(--ink-soft); padding: 1rem 0; }
    @media (prefers-reduced-motion: no-preference) {
      #messages li.new { animation: arrive 0.6s ease-out; }
      @keyframes arrive { from { background: var(--highlight); } to { background: transparent; } }
    }
  </style>
</head>
<body>
  <main>
    <h1>Class guestbook</h1>
    <p class="intro">Anyone can read the guestbook. Log in to sign it, and you can delete your own messages, but nobody else’s.</p>

    <!-- Shown when logged OUT -->
    <form id="auth-form" class="card" hidden>
      <p>Log in or create an account to sign the guestbook.</p>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div>
        <label for="password">Password (at least 6 characters)</label>
        <input id="password" type="password" minlength="6" required autocomplete="current-password">
      </div>
      <div class="actions">
        <button type="submit" id="login-button">Log in</button>
        <button type="button" class="secondary" id="signup-button">Create account</button>
        <span id="auth-status" class="status" role="status"></span>
      </div>
    </form>

    <!-- Shown when logged IN -->
    <div id="signed-in" hidden>
      <div class="card who">
        <p>Logged in as <strong id="user-email"></strong></p>
        <button type="button" class="secondary" id="logout-button">Log out</button>
      </div>

      <form id="guestbook-form" class="card">
        <div>
          <label for="name">Your name</label>
          <input id="name" maxlength="50" required autocomplete="given-name">
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" maxlength="300" required></textarea>
        </div>
        <div class="actions">
          <button type="submit" id="post-button">Sign the guestbook</button>
          <span id="post-status" class="status" role="status"></span>
        </div>
      </form>
    </div>

    <h2>Signatures</h2>
    <ul id="messages"><li class="empty">Loading signatures…</li></ul>
  </main>

  <script>
    // ---------------------------------------------------------------
    // STEP 2: Connect to your Supabase project (safe to be public).
    // ---------------------------------------------------------------
    const SUPABASE_URL = "https://rmlopqauovspnkxnzacj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qbBIuejPZHj8HULKTFeKxg_zAXd8_K5";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null; // who is logged in right now (or null)

    const $ = (id) => document.getElementById(id);

    function setStatus(el, text, isError = false) {
      el.textContent = text;
      el.className = "status" + (isError ? " error" : "");
    }

    // ---------------------------------------------------------------
    // STEP 3: AUTH — sign up, log in, log out
    // ---------------------------------------------------------------
    function readCredentials() {
      return { email: $("email").value.trim(), password: $("password").value };
    }

    // Log in with an existing account
    $("auth-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus($("auth-status"), "Logging in…");
      const { error } = await db.auth.signInWithPassword(readCredentials());
      if (error) setStatus($("auth-status"), error.message, true);
    });

    // Create a brand-new account
    $("signup-button").addEventListener("click", async () => {
      if (!$("auth-form").reportValidity()) return;
      setStatus($("auth-status"), "Creating account…");
      const { data, error } = await db.auth.signUp(readCredentials());
      if (error) {
        setStatus($("auth-status"), error.message, true);
      } else if (!data.session) {
        // Happens when "Confirm email" is turned ON in Supabase
        setStatus($("auth-status"), "Check your email for a confirmation link, then log in.");
      }
    });

    $("logout-button").addEventListener("click", () => db.auth.signOut());

    // Supabase tells us whenever someone logs in or out.
    // We use that to show the right part of the page.
    db.auth.onAuthStateChange((event, session) => {
      currentUser = session ? session.user : null;
      $("auth-form").hidden = !!currentUser;
      $("signed-in").hidden = !currentUser;
      if (currentUser) {
        $("user-email").textContent = currentUser.email;
        setStatus($("auth-status"), "");
        $("password").value = "";
      }
      loadMessages(); // redraw so Delete buttons appear on YOUR messages
    });

    // ---------------------------------------------------------------
    // STEP 4: READ — everyone can read all messages
    // ---------------------------------------------------------------
    async function loadMessages(highlightId = null) {
      const { data, error } = await db
        .from("messages")
        .select("*")
        .order("created_at", { ascending: false });

      const list = $("messages");
      list.innerHTML = "";

      if (error) {
        list.innerHTML = '<li class="empty">Couldn’t load signatures: ' + error.message + "</li>";
        return;
      }
      if (data.length === 0) {
        list.innerHTML = '<li class="empty">No signatures yet. Log in and be the first to sign.</li>';
        return;
      }

      for (const row of data) {
        const li = document.createElement("li");
        if (row.id === highlightId) li.className = "new";

        const top = document.createElement("div");
        top.className = "row-top";

        const name = document.createElement("span");
        name.className = "signature";
        name.textContent = row.name;

        const when = document.createElement("span");
        when.className = "when";
        when.textContent = new Date(row.created_at).toLocaleString();

        top.append(name, when);

        // Only show a Delete button on messages that belong to you.
        // (This is just convenience. The REAL protection is the
        //  Row Level Security rule in the database.)
        if (currentUser && row.user_id === currentUser.id) {
          const yours = document.createElement("span");
          yours.className = "yours";
          yours.textContent = "yours";

          const del = document.createElement("button");
          del.className = "secondary small";
          del.textContent = "Delete";
          del.addEventListener("click", () => deleteMessage(row.id));

          top.append(yours, del);
        }

        const text = document.createElement("p");
        text.className = "text";
        text.textContent = row.message;

        li.append(top, text);
        list.append(li);
      }
    }

    // ---------------------------------------------------------------
    // STEP 5: WRITE — logged-in users add a message.
    // The database fills in user_id automatically from the login.
    // ---------------------------------------------------------------
    $("guestbook-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = $("name").value.trim();
      const message = $("message").value.trim();
      if (!name || !message) return;

      $("post-button").disabled = true;
      setStatus($("post-status"), "Saving…");

      const { data, error } = await db
        .from("messages")
        .insert({ name: name, message: message })
        .select()
        .single();

      $("post-button").disabled = false;

      if (error) {
        setStatus($("post-status"), "Couldn’t save your message: " + error.message, true);
        return;
      }
      $("message").value = "";
      setStatus($("post-status"), "Signed. Thanks, " + name + ".");
      loadMessages(data.id);
    });

    // ---------------------------------------------------------------
    // STEP 6: DELETE — the database only allows deleting your own rows.
    // ---------------------------------------------------------------
    async function deleteMessage(id) {
      const { data, error } = await db
        .from("messages")
        .delete()
        .eq("id", id)
        .select();

      if (error) {
        alert("Couldn’t delete: " + error.message);
      } else if (data.length === 0) {
        // RLS quietly blocked it: no error, but nothing was deleted
        alert("Nothing was deleted. You can only delete your own messages.");
      }
      loadMessages();
    }
  </script>
</body>
</html>
